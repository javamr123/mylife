<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人旅行记录">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data: https://raw.githubusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="theme-color" content="#100e0c">
  <title>路书</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#view">到正文</a>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="seal" aria-hidden="true">记</span>
        <span>
          <strong id="site-title">路书</strong>
          <small id="site-sub">个人旅行记录</small>
          <small id="site-author" hidden></small>
        </span>
      </a>
      <div class="top-actions">
        <button type="button" class="pill" id="auth-pill" data-action="settings">只读</button>
        <button type="button" class="btn ghost" data-action="settings">设置</button>
        <button type="button" class="btn solid" data-action="write">写日志</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1">
      <noscript><p class="status">需要开启 JavaScript。</p></noscript>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="progress-dialog" aria-labelledby="progress-title">
    <div class="dialog-body">
      <h2 id="progress-title">正在保存</h2>
      <p id="progress-text">准备中…</p>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
